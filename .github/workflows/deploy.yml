name: Build & Deploy

on:
  push:
    branches:
      - master
      - test

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_URL || 'http://localhost:8090' }}

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Set deploy vars
        id: vars
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "port=8092" >> $GITHUB_OUTPUT
            echo "container=salyq-cms-master" >> $GITHUB_OUTPUT
          else
            echo "tag=test" >> $GITHUB_OUTPUT
            echo "port=8093" >> $GITHUB_OUTPUT
            echo "container=salyq-cms-test" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: |
          docker pull ghcr.io/algalyq/salyq-cms:${{ steps.vars.outputs.tag }}

      - name: Stop old container
        run: |
          docker stop ${{ steps.vars.outputs.container }} || true
          docker rm ${{ steps.vars.outputs.container }} || true

      - name: Deploy container
        run: |
          docker run -d \
            --name ${{ steps.vars.outputs.container }} \
            --restart unless-stopped \
            -p ${{ steps.vars.outputs.port }}:3000 \
            -e NEXT_PUBLIC_API_URL=${{ vars.API_URL || 'http://localhost:8090' }} \
            ghcr.io/algalyq/salyq-cms:${{ steps.vars.outputs.tag }}

      - name: Cleanup old images
        run: docker image prune -f || true
